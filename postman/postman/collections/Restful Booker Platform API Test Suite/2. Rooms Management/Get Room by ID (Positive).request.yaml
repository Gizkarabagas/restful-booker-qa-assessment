$kind: http-request
url: "{{baseUrl}}/api/room/{{roomId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response matches requested room ID", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData.roomid).to.eql(parseInt(pm.environment.get("roomId")));
      });
    language: text/javascript
order: 2000
