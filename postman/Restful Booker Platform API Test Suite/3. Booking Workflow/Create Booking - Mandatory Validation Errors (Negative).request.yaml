$kind: http-request
url: "{{baseUrl}}/api/booking"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "roomid": {{roomId}},
      "firstname": "",
      "lastname": "",
      "depositpaid": false,
      "bookingdates": {
        "checkin": "2027-01-01",
        "checkout": "2027-01-02"
      },
      "email": "",
      "phone": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Response returns errors array", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('errors');
          pm.expect(jsonData.errors).to.be.an('array').and.not.empty;
      });
    language: text/javascript
order: 2000
